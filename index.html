<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILIPUT — Panel del empleado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#f4f6f9; color:#1a1f2e; font-size:14px; line-height:1.5; min-height:100vh; }

  .topbar { background:#fff; border-bottom:1px solid #dde1e7; padding:0 2rem; height:54px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .topbar-icon { width:26px; height:26px; background:#1a1f2e; border-radius:4px; display:flex; align-items:center; justify-content:center; }
  .topbar-title { font-size:.88rem; font-weight:700; letter-spacing:1.5px; }
  .topbar-divider { width:1px; height:16px; background:#e5e7eb; }
  .topbar-subtitle { font-size:.78rem; color:#9ca3af; }
  .topbar-area { font-size:.78rem; color:#1a1f2e; font-weight:600; }
  .btn-cambiar { margin-left:auto; background:transparent; border:1px solid #d1d5db; color:#6b7280; padding:.35rem .75rem; border-radius:5px; font:600 .75rem 'Inter',sans-serif; cursor:pointer; }
  .btn-cambiar:hover { border-color:#9ca3af; color:#374151; }

  .container { max-width:1040px; margin:0 auto; padding:2rem 1.5rem; }
  .seccion-titulo { font-size:.72rem; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.8px; }
  .lista-header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { padding:.4rem .85rem; border:1px solid #d1d5db; border-radius:5px; background:#fff; color:#374151; font:600 .8rem 'Inter',sans-serif; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:#9ca3af; }
  .chip.on { background:#1a1f2e; border-color:#1a1f2e; color:#fff; }
  :focus-visible { outline:3px solid rgba(55,65,81,.3); outline-offset:1px; }

  .tabla-wrapper { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #dde1e7; font-size:.86rem; min-width:760px; }
  thead { background:#f9fafb; }
  th { padding:.6rem 1rem; text-align:left; font-size:.68rem; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
  td { padding:.85rem 1rem; border-bottom:1px solid #f3f4f6; color:#374151; vertical-align:top; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#fafafa; }
  tr.pendiente td:first-child  { box-shadow:inset 4px 0 0 #dc2626; }
  tr.en_proceso td:first-child { box-shadow:inset 4px 0 0 #f59e0b; }
  tr.resuelto td:first-child   { box-shadow:inset 4px 0 0 #16a34a; }
  tr.resuelto td:not(:first-child) { opacity:.75; }
  .col-desc { max-width:340px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .col-fecha { white-space:nowrap; color:#6b7280; font-size:.8rem; }

  .badge { padding:2px 9px; border-radius:4px; font-size:.72rem; font-weight:600; border:1px solid #d1d5db; background:#f3f4f6; color:#374151; white-space:nowrap; }
  .badge.Alto { background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
  .badge.Extremo { background:#1a1f2e; color:#fff; border-color:#1a1f2e; }

  select.estado { padding:.35rem .5rem; border:1px solid; border-radius:4px; font:600 .78rem 'Inter',sans-serif; cursor:pointer; }
  select.estado.pendiente  { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  select.estado.en_proceso { background:#fffbeb; color:#92400e; border-color:#fde68a; }
  select.estado.resuelto   { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }

  .btn-eliminar { background:transparent; color:#9ca3af; border:1px solid #e5e7eb; padding:3px 10px; border-radius:4px; cursor:pointer; font:500 .75rem 'Inter',sans-serif; transition:all .15s; }
  .btn-eliminar:hover { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  .vacio { text-align:center; padding:3rem; color:#9ca3af; background:#fff; border:1px solid #dde1e7; border-radius:8px; }

  /* Pantalla de selección de área */
  .selector-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .selector-card { background:#fff; border:1px solid #dde1e7; border-radius:10px; padding:2rem; max-width:380px; width:100%; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .selector-card h1 { font-size:1rem; margin-bottom:.3rem; }
  .selector-card p { font-size:.82rem; color:#6b7280; margin-bottom:1.3rem; }
  .selector-lista { display:flex; flex-direction:column; gap:8px; }
  .selector-btn { padding:.7rem .9rem; border:1px solid #d1d5db; border-radius:6px; background:#fff; color:#1a1f2e; font:600 .88rem 'Inter',sans-serif; text-align:left; cursor:pointer; transition:all .15s; }
  .selector-btn:hover { border-color:#1a1f2e; background:#f9fafb; }

  @media (max-width:640px) { .topbar { padding:0 1rem; } .container { padding:1.25rem 1rem; } }
</style>
</head>
<body>

<!-- Pantalla para elegir el área (solo se ve la primera vez, o al pulsar "Cambiar área") -->
<div class="selector-wrap" id="selector" style="display:none;">
  <div class="selector-card">
    <h1>¿Cuál es tu área?</h1>
    <p>Selecciona tu área para ver únicamente tus tareas asignadas.</p>
    <div class="selector-lista" id="selectorLista"></div>
  </div>
</div>

<div id="admin-panel" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      </div>
      <span class="topbar-title">LILIPUT</span>
      <div class="topbar-divider"></div>
      <span class="topbar-area" id="areaActual"></span>
    </div>
    <button class="btn-cambiar" id="btnCambiar">Cambiar área</button>
  </div>

  <div class="container">
    <div class="lista-header">
      <div class="seccion-titulo">Tus tareas</div>
      <div class="filtros" id="chips"></div>
    </div>
    <div class="tabla-wrapper" id="lista"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEfSTXcUGUuqjMx9Q4aVmrnBlAt4CLmBQ",
    authDomain: "seguimiento-36625.firebaseapp.com",
    projectId: "seguimiento-36625",
    storageBucket: "seguimiento-36625.firebasestorage.app",
    messagingSenderId: "766412601013",
    appId: "1:766412601013:web:7768807f3a1f729a2530fc",
    measurementId: "G-KW4B971W92"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Debe coincidir EXACTAMENTE con las opciones del panel del jefe (admin.html)
  const AREAS = ["Diseño gráfico", "Psicología", "Administración", "Software", "Marketing"];
  const CLAVE = "liliput_area";

  const $ = (id) => document.getElementById(id);
  const nombres = { pendiente:"Pendiente", en_proceso:"En proceso", resuelto:"Resuelto" };
  let datos = [], filtroEstado = "", unsub = null;

  function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

  function mostrarSelector() {
    if (unsub) { unsub(); unsub = null; }
    $("admin-panel").style.display = "none";
    $("selector").style.display = "flex";
    $("selectorLista").innerHTML = AREAS.map(a => `<button class="selector-btn" data-a="${esc(a)}">${esc(a)}</button>`).join("");
  }

  function mostrarPanel(area) {
    $("selector").style.display = "none";
    $("admin-panel").style.display = "block";
    $("areaActual").textContent = area;

    if (unsub) unsub();
    unsub = onSnapshot(
      query(collection(db, "tareas"), where("area", "==", area)),
      (snap) => {
        datos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        datos.sort((a, b) => (b.creado?.seconds ?? 0) - (a.creado?.seconds ?? 0));
        pintar();
      },
      (e) => {
        console.error(e);
        $("lista").innerHTML = `<div class="vacio">No se pudieron cargar las tareas. Revisa tu conexión o las reglas de Firestore.</div>`;
      }
    );
  }

  function pintar() {
    const n = (e) => datos.filter(i => i.estado === e).length;

    $("chips").innerHTML = [["", "Todas", datos.length], ["pendiente", "Pendientes", n("pendiente")],
      ["en_proceso", "En proceso", n("en_proceso")], ["resuelto", "Resueltas", n("resuelto")]]
      .map(([v, t, c]) => `<button class="chip ${filtroEstado === v ? "on" : ""}" data-e="${v}">${t}: ${c}</button>`).join("");

    const lista = datos.filter(i => !filtroEstado || i.estado === filtroEstado);
    if (!lista.length) { $("lista").innerHTML = `<div class="vacio">No hay tareas en esta vista.</div>`; return; }

    $("lista").innerHTML = `<table>
      <thead><tr><th>Fecha</th><th>Nivel</th><th>Descripción</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.map(i => {
        const f = i.creado?.toDate ? i.creado.toDate().toLocaleString("es-PE", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }) : "…";
        return `<tr class="${i.estado}">
          <td class="col-fecha">${f}</td>
          <td><span class="badge ${esc(i.nivel)}">${esc(i.nivel)}</span></td>
          <td class="col-desc">${esc(i.descripcion)}</td>
          <td><select class="estado ${i.estado}" data-id="${i.id}" aria-label="Estado">
            ${Object.entries(nombres).map(([v, t]) => `<option value="${v}" ${i.estado === v ? "selected" : ""}>${t}</option>`).join("")}
          </select></td>
          <td><button class="btn-eliminar" data-del="${i.id}">Eliminar</button></td>
        </tr>`;
      }).join("")}</tbody></table>`;
  }

  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-e]"); if (!b) return;
    filtroEstado = b.dataset.e; pintar();
  });
  $("lista").addEventListener("change", async (e) => {
    const s = e.target.closest("select.estado"); if (!s) return;
    try { await updateDoc(doc(db, "tareas", s.dataset.id), { estado: s.value }); }
    catch (err) { alert("No se pudo actualizar: " + err.message); }
  });
  $("lista").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (!confirm("¿Confirma la eliminación de esta tarea?")) return;
    try { await deleteDoc(doc(db, "tareas", b.dataset.del)); }
    catch (err) { alert("No se pudo eliminar: " + err.message); }
  });
  $("selectorLista").addEventListener("click", (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    localStorage.setItem(CLAVE, b.dataset.a);
    mostrarPanel(b.dataset.a);
  });
  $("btnCambiar").addEventListener("click", () => {
    localStorage.removeItem(CLAVE);
    mostrarSelector();
  });

  // Arranque: si ya eligió un área antes, entra directo; si no, muestra el selector.
  const guardada = localStorage.getItem(CLAVE);
  if (guardada && AREAS.includes(guardada)) mostrarPanel(guardada);
  else mostrarSelector();
</script>
</body>
</html>
