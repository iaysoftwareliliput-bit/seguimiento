<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILIPUT — Panel del Jefe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#f4f6f9; color:#cfd4e1; font-size:14px; line-height:1.5; min-height:100vh; }

  .topbar { background:#000000; border-bottom:1px solid #dde1e7; padding:0 2rem; height:54px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
  .topbar-icon { width:26px; height:26px; background:#8d8e91; border-radius:4px; display:flex; align-items:center; justify-content:center; }
  .topbar-title { font-size:.88rem; font-weight:700; letter-spacing:1.5px; }
  .topbar-divider { width:1px; height:16px; background:#e5e7eb; }
  .topbar-subtitle { font-size:.78rem; color:#9ca3af; }

  .container { max-width:680px; margin:0 auto; padding:2rem 1.5rem 3rem; }
  .seccion-titulo { font-size:.72rem; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.8px; margin-bottom:.75rem; }
  .card { background:#fff; border:1px solid #dde1e7; border-radius:8px; padding:1.5rem; margin-bottom:2rem; box-shadow:0 1px 3px rgba(0,0,0,.04); }

  .campo { display:flex; flex-direction:column; gap:.3rem; margin-bottom:1.1rem; }
  .campo > label, .campo > .lbl { font-weight:600; font-size:.72rem; color:#6b7280; text-transform:uppercase; letter-spacing:.5px; }
  select, textarea, input[type="text"] { padding:.58rem .75rem; border:1px solid #d1d5db; border-radius:5px; font-family:inherit; font-size:.9rem; color:#1a1f2e; background:#fff; outline:none; width:100%; transition:border-color .15s, box-shadow .15s; }
  textarea { min-height:120px; resize:vertical; }
  select:focus, textarea:focus, input[type="text"]:focus { border-color:#374151; box-shadow:0 0 0 3px rgba(55,65,81,.08); }
  .hint { font-size:.7rem; color:#9ca3af; }

  .niveles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .niveles input { position:absolute; opacity:0; pointer-events:none; }
  .niveles label { text-align:center; padding:.55rem .25rem; border:1px solid #d1d5db; border-radius:5px; cursor:pointer; font-size:.85rem; font-weight:500; color:#374151; background:#fff; transition:all .15s; }
  .niveles label:hover { border-color:#9ca3af; }
  .niveles input:checked + label { background:#1a1f2e; border-color:#1a1f2e; color:#fff; font-weight:600; }
  .niveles input:focus-visible + label { box-shadow:0 0 0 3px rgba(55,65,81,.25); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:.7rem 1.4rem; background:#1a1f2e; color:#fff; border:none; border-radius:5px; font-family:inherit; font-size:.88rem; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn:hover:not(:disabled) { background:#2d3548; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn:focus-visible { outline:3px solid rgba(55,65,81,.35); outline-offset:2px; }

  #msg { display:none; padding:.7rem 1rem; border-radius:6px; margin-top:1rem; font-weight:500; font-size:.85rem; }
  #msg.exito { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
  #msg.error { display:block; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }

  .lista { display:grid; gap:10px; }
  .vacio { text-align:center; padding:2.5rem 1rem; color:#9ca3af; background:#fff; border:1px solid #dde1e7; border-radius:8px; }
  .inc { background:#fff; border:1px solid #dde1e7; border-radius:8px; padding:1rem 1.1rem; }
  .inc-top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:.55rem; }
  .inc-meta { font-size:.78rem; color:#6b7280; }
  .inc-desc { font-size:.88rem; color:#374151; white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:.8rem; }
  .badge { padding:2px 9px; border-radius:4px; font-size:.72rem; font-weight:600; border:1px solid; white-space:nowrap; }
  .badge.pendiente { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  .badge.en_proceso { background:#fffbeb; color:#92400e; border-color:#fde68a; }
  .badge.resuelto { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
  .progreso { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:.4rem; }
  .progreso span { height:4px; border-radius:2px; background:#e5e7eb; }
  .pendiente .progreso span:nth-child(1) { background:#dc2626; }
  .en_proceso .progreso span:nth-child(-n+2) { background:#f59e0b; }
  .resuelto .progreso span { background:#16a34a; }
  .estado-txt { font-size:.75rem; color:#6b7280; }

  @media (max-width:640px) { .topbar { padding:0 1rem; } .container { padding:1.25rem 1rem; } .niveles { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
  </div>
  <span class="topbar-title">LILIPUT</span>
  <div class="topbar-divider"></div>
  <span class="topbar-subtitle">panel del jefe</span>
</div>

<div class="container">
  <div class="seccion-titulo">Nueva tarea</div>
  <form class="card" id="form">
    <div class="campo">
      <span class="lbl" id="lbl-nivel">Nivel de la tarea</span>
      <div class="niveles" role="radiogroup" aria-labelledby="lbl-nivel">
        <input type="radio" name="nivel" id="n1" value="Bajo" required><label for="n1">Bajo</label>
        <input type="radio" name="nivel" id="n2" value="Medio"><label for="n2">Medio</label>
        <input type="radio" name="nivel" id="n3" value="Alto"><label for="n3">Alto</label>
      </div>
    </div>

    <div class="campo">
      <label for="area">Área</label>
      <select id="area" required>
        <option value="" disabled selected>Selecciona el área de la tarea a asignar</option>
        <option>Diseño gráfico</option>
        <option>Psicología</option>
        <option>Administración</option>
        <option>Software</option>
        <option>Marketing</option>
      </select>
    </div>

    <div class="campo">
      <label for="empleado">Asignar a (nombre del empleado)</label>
      <input type="text" id="empleado" required minlength="2" maxlength="80" placeholder="Ej: María Pérez">
    </div>

    <div class="campo">
      <label for="desc">Descripción de la tarea</label>
      <textarea id="desc" required minlength="5" maxlength="2000" placeholder="Describa la tarea."></textarea>
    </div>

    <button class="btn" type="submit" id="btn">Enviar tarea</button>
    <div id="msg" role="status"></div>
  </form>

  <div class="seccion-titulo">Todas las tareas</div>
  <div class="lista" id="lista"></div>
  <p class="hint" style="margin-top:.75rem;">Aquí ves todas las tareas asignadas y su avance. Se actualiza solo.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ CONFIGURACIÓN DE EJEMPLO. Reemplázala por la real de tu proyecto de Firebase.
  // Debe ser IDÉNTICA a la que uses en empleado.html (mismo proyecto).
  const firebaseConfig = {
  apiKey: "AIzaSyBEfSTXcUGUuqjMx9Q4aVmrnBlAt4CLmBQ",
  authDomain: "seguimiento-36625.firebaseapp.com",
  projectId: "seguimiento-36625",
  storageBucket: "seguimiento-36625.firebasestorage.app",
  messagingSenderId: "766412601013",
  appId: "1:766412601013:web:7768807f3a1f729a2530fc",
  measurementId: "G-KW4B971W92"
};
  const db = getFirestore(initializeApp(firebaseConfig));

  const $ = (id) => document.getElementById(id);
  const COLECCION = "tareas";
  const textos = {
    pendiente:  ["Pendiente",  "Recibida. Aún no se ha empezado a atender."],
    en_proceso: ["En proceso", "Se está trabajando en la tarea."],
    resuelto:   ["Resuelto",   "La tarea ya fue resuelta."]
  };

  function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

  const form = $("form"), btn = $("btn"), msg = $("msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true; msg.className = "";
    try {
      await addDoc(collection(db, COLECCION), {
        nivel: form.nivel.value,
        area: $("area").value,
        empleado: $("empleado").value.trim(),
        descripcion: $("desc").value.trim(),
        estado: "pendiente",
        creado: serverTimestamp()
      });
      form.reset();
      msg.textContent = "Tarea enviada y asignada.";
      msg.className = "exito";
    } catch (err) {
      console.error(err);
      msg.textContent = "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.";
      msg.className = "error";
    }
    btn.disabled = false;
  });

  onSnapshot(collection(db, COLECCION), (snap) => {
    const items = [];
    snap.forEach(d => items.push({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.creado?.seconds ?? 9e12) - (a.creado?.seconds ?? 9e12));

    $("lista").innerHTML = items.length ? items.map(i => {
      const [t, sub] = textos[i.estado] || [i.estado, ""];
      const f = i.creado?.toDate ? i.creado.toDate().toLocaleDateString("es-PE", { day:"2-digit", month:"short", year:"numeric" }) : "Enviando…";
      return `<article class="inc ${i.estado}">
        <div class="inc-top">
          <span class="inc-meta"><strong>${esc(i.empleado)}</strong> · ${esc(i.area)} · Nivel ${esc(i.nivel)} · ${f}</span>
          <span class="badge ${i.estado}">${t}</span>
        </div>
        <p class="inc-desc">${esc(i.descripcion)}</p>
        <div class="progreso" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="estado-txt">${sub}</div>
      </article>`;
    }).join("") : `<div class="vacio">Aún no hay tareas registradas.</div>`;
  }, () => {});
</script>
</body>
</html>
